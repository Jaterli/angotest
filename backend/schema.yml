components:
  schemas:
    AIRequestLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        test_id:
          type: integer
          readOnly: true
          nullable: true
        test_title:
          type: string
          readOnly: true
          nullable: true
        main_topic:
          type: string
          maxLength: 255
        sub_topic:
          type: string
          maxLength: 255
        specific_topic:
          type: string
          maxLength: 255
        level:
          type: string
          maxLength: 20
        num_questions:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        num_answers:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        language:
          type: string
          maxLength: 2
        generation_mode:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/Status8bfEnum'
        error_message:
          type: string
        response_time:
          type: number
          format: double
        tokens_used:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - level
      - num_answers
      - num_questions
      - test_id
      - test_title
      - updated_at
    AIRequestLogDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        test:
          type: string
          readOnly: true
        input:
          type: string
          readOnly: true
        ai_provider:
          type: string
          maxLength: 50
        ai_model:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/Status8bfEnum'
        error_message:
          type: string
        response_time:
          type: number
          format: double
        tokens_used:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - input
      - test
      - updated_at
    AccuracyTimeItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        total_attempts:
          type: integer
        accuracy_rate:
          type: number
          format: double
        avg_time:
          type: number
          format: double
      required:
      - id
      - title
      - total_attempts
    ActivitySummaryResponse:
      type: object
      properties:
        daily_results:
          type: array
          items:
            $ref: '#/components/schemas/DailyResultItem'
        daily_users:
          type: array
          items:
            $ref: '#/components/schemas/DailyCountItem'
        daily_tests:
          type: array
          items:
            $ref: '#/components/schemas/DailyCountItem'
        start_date:
          type: string
        end_date:
          type: string
      required:
      - daily_results
      - daily_tests
      - daily_users
      - end_date
      - start_date
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer_text:
          type: string
        is_correct:
          type: boolean
      required:
      - answer_text
      - id
    AnswerCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer_text:
          type: string
        is_correct:
          type: boolean
      required:
      - answer_text
      - id
    BulkDeleteResponse:
      type: object
      properties:
        message:
          type: string
        deleted_count:
          type: integer
        deleted_ids:
          type: array
          items:
            type: integer
      required:
      - deleted_count
      - deleted_ids
      - message
    CheckAuthResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
      required:
      - authenticated
    CompletedTest:
      type: object
      properties:
