openapi: 3.0.3
info:
  title: AngoTest
  version: 1.0.0
  description: ' La plataforma definitiva para crear, gestionar y realizar tests online.'
paths:
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      description: 'Obtiene métricas generales: totales, tests destacados, listas
        de usuarios'
      summary: Dashboard administrativo
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: Datos del dashboard
  /api/admin/dashboard/activity-summary/:
    get:
      operationId: admin_dashboard_activity_summary_retrieve
      description: Muestra resultados, usuarios y tests por día en los últimos 30
        días
      summary: Resumen de actividad diaria
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySummaryResponse'
          description: Actividad diaria
  /api/admin/dashboard/performance-metrics/:
    get:
      operationId: admin_dashboard_performance_metrics_retrieve
      description: Tasa de finalización, precisión, tiempo promedio, distribución
        por nivel y rol
      summary: Métricas de rendimiento globales
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceMetricsResponse'
          description: Métricas de rendimiento
  /api/admin/dashboard/tests/{test_id}/stats/:
    get:
      operationId: admin_dashboard_tests_stats_retrieve
      summary: Estadísticas detalladas de un test
      parameters:
      - in: path
        name: test_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDetailedStatsResponse'
          description: Estadísticas del test
        '404':
          description: Test no encontrado
  /api/admin/dashboard/users/{user_id}/stats/:
    get:
      operationId: admin_dashboard_users_stats_retrieve
      summary: Estadísticas detalladas de un usuario
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailedStatsResponse'
          description: Estadísticas del usuario
        '404':
          description: Usuario no encontrado
  /api/admin/quotas/:
    get:
      operationId: admin_quotas_list
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: max_requests
        schema:
          type: integer
      - in: query
        name: min_requests
        schema:
          type: integer
      - in: query
        name: min_usage
        schema:
          type: number
      - in: query
        name: month_year
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: user_id
        schema:
          type: number
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserQuotaList'
          description: ''
  /api/admin/quotas/{quota_id}/:
    get:
      operationId: admin_quotas_retrieve
      parameters:
      - in: path
        name: quota_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQuota'
          description: ''
  /api/admin/quotas/{quota_id}/delete/:
    delete:
      operationId: admin_quotas_delete_destroy
      summary: Eliminar una cuota
      parameters:
      - in: path
        name: quota_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQuotaDeleteResponse'
          description: Cuota eliminada
        '404':
          description: Cuota no encontrada
  /api/admin/quotas/{quota_id}/update/:
    put:
      operationId: admin_quotas_update_update
      summary: Actualizar una cuota existente
      parameters:
      - in: path
        name: quota_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserQuotaUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserQuotaUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserQuotaUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQuotaUpdateResponse'
          description: Cuota actualizada
        '400':
          description: Datos inválidos
        '404':
          description: Cuota no encontrada
    patch:
      operationId: admin_quotas_update_partial_update
      summary: Actualizar una cuota existente
      parameters:
      - in: path
        name: quota_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserQuotaUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserQuotaUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserQuotaUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQuotaUpdateResponse'
          description: Cuota actualizada
        '400':
          description: Datos inválidos
        '404':
          description: Cuota no encontrada
  /api/admin/quotas/bulk-delete/:
    delete:
      operationId: admin_quotas_bulk_delete_destroy
      summary: Eliminar múltiples cuotas
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
          description: Cuotas eliminadas
        '400':
          description: Datos inválidos
        '404':
          description: Alguna cuota no existe
  /api/admin/quotas/create/:
    post:
      operationId: admin_quotas_create_create
      summary: Crear una nueva cuota de usuario
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserQuotaCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserQuotaCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserQuotaCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserQuotaCreateResponse'
          description: Cuota creada
        '404':
          description: Usuario no encontrado
        '409':
          description: Ya existe una cuota para ese usuario y mes
        '400':
          description: Datos inválidos
  /api/admin/quotas/export/csv/:
    get:
      operationId: admin_quotas_export_csv_retrieve
      summary: Exportar cuotas a CSV
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Archivo CSV
  /api/admin/quotas/stats/:
    get:
      operationId: admin_quotas_stats_retrieve
      summary: Estadísticas de cuotas
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaStatsResponse'
          description: Estadísticas
  /api/admin/system-configs/:
    get:
      operationId: admin_system_configs_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSystemConfigList'
          description: ''
  /api/admin/system-configs/{config_id}/delete/:
    delete:
      operationId: admin_system_configs_delete_destroy
      parameters:
      - in: path
        name: config_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      responses:
        '204':
          description: No response body
  /api/admin/system-configs/{config_id}/update/:
    put:
      operationId: admin_system_configs_update_update
      parameters:
      - in: path
        name: config_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SystemConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SystemConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
          description: ''
    patch:
      operationId: admin_system_configs_update_partial_update
      parameters:
      - in: path
        name: config_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSystemConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSystemConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSystemConfig'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
          description: ''
  /api/admin/system-configs/create/:
    post:
      operationId: admin_system_configs_create_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SystemConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SystemConfig'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
          description: ''
  /api/admin/system-configs/default/:
    get:
      operationId: admin_system_configs_default_retrieve
      description: Lista las configuraciones definidas en settings.SYSTEM_CONFIG y
        su existencia en BD
      summary: Obtener configuraciones por defecto
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultSystemConfigsResponse'
          description: Lista de configuraciones
  /api/admin/system-configs/key/{key}/:
    get:
      operationId: admin_system_configs_key_retrieve
      description: Devuelve el valor como entero (o error si no existe)
      summary: Obtener configuración por clave
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigByKeyResponse'
          description: Valor encontrado
        '404':
          description: Clave no encontrada
  /api/admin/users/{user_id}/quota-months/:
    get:
      operationId: admin_users_quota_months_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      responses:
        '200':
          description: No response body
  /api/admin/users/{user_id}/quotas/:
    get:
      operationId: admin_users_quotas_list
      description: Devuelve la cuota del usuario para un mes dado (o la más reciente
        si no se especifica)
      summary: Obtener cuota de un usuario específico
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuotaByUserResponseList'
          description: Cuota encontrada
        '404':
          description: Cuota no encontrada
  /api/ai-requests/generate-ai-test/:
    post:
      operationId: ai_requests_generate_ai_test_create
      description: Generar un test usando IA
      tags:
      - ai-requests
      responses:
        '200':
          description: No response body
  /api/ai-requests/logs/:
    get:
      operationId: ai_requests_logs_list
      description: Obtener historial de solicitudes de IA del usuario
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - ai-requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIRequestLogList'
          description: ''
  /api/ai-requests/logs/{log_id}/:
    get:
      operationId: ai_requests_logs_retrieve
      description: Obtener detalle de una solicitud de IA
      parameters:
      - in: path
        name: log_id
        schema:
          type: integer
        required: true
      tags:
      - ai-requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIRequestLogDetail'
          description: ''
  /api/ai-requests/quota/:
    get:
      operationId: ai_requests_quota_retrieve
      description: Obtener la quota actual del usuario
      tags:
      - ai-requests
      responses:
        '200':
          description: No response body
  /api/auth/check-auth:
    get:
      operationId: auth_check_auth_retrieve
      description: Comprueba si el token JWT es válido y devuelve los datos del usuario
        autenticado
      summary: Verificar autenticación
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAuthResponse'
          description: Estado de autenticación
  /api/auth/forgot-password:
    post:
      operationId: auth_forgot_password_create
      description: Envía un correo con un enlace para restablecer la contraseña
      summary: Solicitar recuperación de contraseña
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
          description: Correo enviado (si existe el email)
        '400':
          description: Datos inválidos
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Autentica un usuario y devuelve un token JWT en cookie HttpOnly
      summary: Inicio de sesión
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Login exitoso
        '401':
          description: Credenciales inválidas o cuenta desactivada
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: Elimina la cookie de autenticación
      summary: Cerrar sesión
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: Sesión cerrada
  /api/auth/register:
    post:
      operationId: auth_register_create
      description: Crea una nueva cuenta de usuario
      summary: Registro de usuario
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: Usuario creado
        '400':
          description: Datos inválidos
  /api/auth/reset-password-with-token:
    post:
      operationId: auth_reset_password_with_token_create
      description: Cambia la contraseña usando un token válido
      summary: Restablecer contraseña con token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
          description: Contraseña actualizada
        '400':
          description: Token inválido, expirado o datos incorrectos
  /api/auth/validate-reset-token:
    get:
      operationId: auth_validate_reset_token_retrieve
      description: Comprueba si el token de restablecimiento es válido y no ha expirado
      summary: Validar token de recuperación
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResetTokenResponse'
          description: Token válido
        '400':
          description: Token inválido o expirado
  /api/invitations/accept-invitation/:
    post:
      operationId: invitations_accept_invitation_create
      description: Aceptar una invitación
      tags:
      - invitations
      responses:
        '200':
          description: No response body
  /api/invitations/admin/{invitation_id}/delete/:
    delete:
      operationId: invitations_admin_delete_destroy
      description: Eliminar una invitación específica
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: integer
        required: true
      tags:
      - invitations
      responses:
        '204':
          description: No response body
  /api/invitations/admin/bulk-delete/:
    delete:
      operationId: invitations_admin_bulk_delete_destroy
      description: Eliminar múltiples invitaciones
      tags:
      - invitations
      responses:
        '204':
          description: No response body
  /api/invitations/admin/list/:
    get:
      operationId: invitations_admin_list_list
      description: Obtener todas las invitaciones con filtros y paginación
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: invited_by
        schema:
          type: number
      - in: query
        name: is_guest
        schema:
          type: boolean
      - in: query
        name: is_used
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - expired
          - used
        description: |-
          * `active` - Active
          * `used` - Used
          * `expired` - Expired
      tags:
      - invitations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationListList'
          description: ''
  /api/invitations/admin/stats/:
    get:
      operationId: invitations_admin_stats_retrieve
      description: Obtener estadísticas de invitaciones
      tags:
      - invitations
      responses:
        '200':
          description: No response body
  /api/invitations/check-invitation/:
    get:
      operationId: invitations_check_invitation_retrieve
      description: Verificar estado de una invitación
      tags:
      - invitations
      responses:
        '200':
          description: No response body
  /api/invitations/create/:
    post:
      operationId: invitations_create_create
      description: Crear una nueva invitación
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreate'
          description: ''
  /api/results/:
    get:
      operationId: results_list
      parameters:
      - in: query
        name: max_score
        schema:
          type: number
      - in: query
        name: min_score
        schema:
          type: number
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: started_at
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: test_created_by
        schema:
